# Production Deployment Configuration for vLLM on H200 GPU
#
# This configuration is optimized for H200 GPU (80/96GB VRAM)
# Models: DeepSeek R1, GPT OSS 120B, Qwen/QwQ

# Model Selection
llm:
  provider: "vllm"  # Use direct vLLM for maximum performance

  # Model options (uncomment one):
  # model: "deepseek-ai/DeepSeek-R1"  # DeepSeek R1 (671B params, needs multi-GPU)
  # model: "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"  # Distilled version for single H200
  model: "Qwen/QwQ-32B-Preview"  # Qwen QwQ (fits single H200)
  # model: "huggyllama/llama-120b"  # GPT OSS 120B equivalent

  # Inference parameters
  temperature: 0.1
  max_tokens: 4096
  top_p: 0.95

  # vLLM-specific parameters for H200
  gpu_memory_utilization: 0.90  # Use 90% of 96GB VRAM
  tensor_parallel_size: 1  # Single H200, increase for multi-GPU
  max_model_len: 32768  # Maximum sequence length
  trust_remote_code: true  # Required for some models
  dtype: "bfloat16"  # or "float16" - bf16 recommended for H200

  # H200-specific optimizations
  enable_prefix_caching: true  # Cache prefixes for efficiency
  use_v2_block_manager: true  # New vLLM block manager
  max_num_seqs: 256  # Batch size for H200

# For multi-GPU deployment (2-4 H200s for DeepSeek R1):
# tensor_parallel_size: 4  # 4x H200 for 671B model
# pipeline_parallel_size: 1  # No pipeline parallelism needed
# distributed_executor_backend: "ray"  # or "mp" for multiprocessing

# Ontology settings
ontology:
  reasoner: "elk"
  owl_profile: "OWL2_EL"
  enable_reasoning: true

# Embedding (use local model on GPU)
embedding:
  model: "sentence-transformers/all-mpnet-base-v2"
  device: "cuda"  # H200 GPU
  batch_size: 128  # Large batches for H200

# Verification
verification:
  enable_verification: true
  solver: "z3"
  timeout: 30

# Storage
storage:
  triple_store: "memory"  # or "rdfox" for production
  vector_store: "chroma"
  vector_store_path: "./data/vector_store"

# Extraction
extraction:
  confidence_threshold: 0.7
  max_entities_per_document: 1000
  max_triples_per_document: 5000

# Logging
log_level: "INFO"
debug: false
