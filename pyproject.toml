[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralog"
version = "0.1.0"
description = "Neural Symbolic AI for Information Extraction"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "NeuraLog Contributors"}
]
keywords = [
    "neural-symbolic-ai",
    "knowledge-graphs",
    "information-extraction",
    "ontology",
    "llm",
    "semantic-web"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core dependencies
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",

    # Graph processing
    "networkx>=3.1",
    "rdflib>=7.0.0",
    "SPARQLWrapper>=2.0.0",

    # Deep learning (compatible with vLLM)
    "torch>=2.1.0,<2.5.0",
    "transformers>=4.40.0",
    "accelerate>=0.20.0",

    # NLP and embeddings
    "sentence-transformers>=2.2.0",
    "tokenizers>=0.15.0",

    # LLM APIs (optional, for fallback)
    "openai>=1.0.0",
    "anthropic>=0.18.0",

    # Ontology processing (DeepOnto and dependencies)
    "deeponto>=0.9.0",
    "JPype1>=1.4.1",
    "owlready2>=0.46",

    # Vector stores
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.4",

    # Formal reasoning
    "z3-solver>=4.12.0",

    # API and serving
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Utilities
    "loguru>=0.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
# Production deployment with vLLM for H200 GPU
production = [
    "vllm>=0.4.0",
    "ray>=2.9.0",  # For distributed inference
    "triton>=2.1.0",  # For optimized kernels
    "xformers>=0.0.23",  # Memory-efficient attention
    "flash-attn>=2.5.0",  # Flash attention for speed
]

# Graph neural networks (optional, heavy)
graph = [
    "torch-geometric>=2.3.0",
    "dgl>=1.1.0",
]

# LangChain integration (optional)
langchain = [
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
    "pre-commit>=3.3.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.0",
    "mkdocstrings[python]>=0.22.0",
]

all = [
    "neuralog[production,graph,langchain,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/yourusername/neuralog"
Documentation = "https://neuralog.readthedocs.io"
Repository = "https://github.com/yourusername/neuralog"
Issues = "https://github.com/yourusername/neuralog/issues"

[tool.setuptools.packages.find]
include = ["neuralog*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=neuralog",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_gpu: marks tests that require GPU",
    "requires_llm: marks tests that require LLM API access",
]
